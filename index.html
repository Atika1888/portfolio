        </div>

    </section>

    <!-- TYPING EFFECT -->
    <script>
        const roles = [
            "Frontend Developer",
            "Data Analyst",
            "Problem Solver"
        ];

        let i = 0;
        let j = 0;
        let isDeleting = false;

        function typeEffect() {
            let current = roles[i];

            document.getElementById("role-text").innerHTML =
                current.substring(0, j);

            if (!isDeleting) j++;
            else j--;

            if (j === current.length + 1) {
                isDeleting = true;
                setTimeout(typeEffect, 1000);
                return;
            }

            if (j === 0) {
                isDeleting = false;
                i = (i + 1) % roles.length;
            }

            setTimeout(typeEffect, isDeleting ? 70 : 120);
        }

        typeEffect();
    </script>
